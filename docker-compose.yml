version: '3.8'

services:
  api:
    build: .
    container_name: spotter_fuel_route_planner
    ports:
      - "8000:8000"
    environment:
      - DEBUG=True
      - SECRET_KEY=django-insecure-spotter-fuel-route-planner-assessment-docker
      - ALLOWED_HOSTS=*
      - OSRM_BASE_URL=http://router.project-osrm.org
      - NOMINATIM_BASE_URL=https://nominatim.openstreetmap.org
      - NOMINATIM_USER_AGENT=SpotterFuelRoutePlanner/1.0
      - FUEL_DATA_PATH=data/fuel-prices.csv
      - US_CITIES_PATH=data/us_cities.csv
      - MAX_VEHICLE_RANGE_MILES=500
      - FUEL_EFFICIENCY_MPG=10
      - MAX_STATION_DISTANCE_FROM_ROUTE_MILES=15
    volumes:
      - ./data:/app/data
    restart: unless-stopped
